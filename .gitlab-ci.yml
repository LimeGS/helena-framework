# Test, then deploy a whole platform, then check the deployment answers.
#
# ---------------------------------------------------------------------------
# Two branches, two deployments
# ---------------------------------------------------------------------------
#
#   development  ->  work-3   the whole platform, no GPU
#   staging      ->  gpu-1         the whole platform, with the cards
#
# They are separate deployments, not one environment behind another. Each has
# its own Postgres and works its own queue; neither reads the other's. They are
# expected to run different versions -- that is the point of having both.
#
# Nothing deploys from any other branch, and nothing deploys that has not passed
# the suite: the deploy jobs need the test jobs, so a red suite stops the
# pipeline rather than producing a warning beside a green deployment.
#
# ---------------------------------------------------------------------------
# What gets deployed
# ---------------------------------------------------------------------------
#
# All of it, which is new. containers/deploy-platform.sh holds the list, and
# both deploy jobs call that one script with a profile -- so "the platform"
# is defined in one place instead of being whatever a job happened to name.
#
# It used to be one service. `deploy to work-3` pulled the panel and
# nothing else, and the manual script's `all` covered three of six projects, so
# ink, backup and host-report sat six commits behind through several releases
# while every signal said the deploy had succeeded.
#
# Deploying the GPU half interrupts whatever the cards are doing. That work
# requeues when its lease expires, and it is a deliberate trade: a deploy that
# waits for a busy queue to drain is a deploy that never happens.
#
# ---------------------------------------------------------------------------
# Where each job runs
# ---------------------------------------------------------------------------
#
# `frontend` is untagged: it needs a container and nothing else, so it runs
# wherever there is capacity.
#
# The CI image, tests, and panel image build share `HELENA_CI_RUNNER`: it is
# `work-3` by default and `gpu-1` for staging. They do not touch a
# deployment, and non-staging work keeps unit tests off a machine whose cards
# are usually busy. The unit job additionally has to use the selected runner:
# its image is built on that runner's own daemon in the prepare stage and exists
# in no registry.
#
# The deploy and smoke jobs are tagged for the host they are about --
# `work-3` from development, `gpu-1` from staging -- and each proves it is
# on that machine before doing anything. The tag is a request; the check is the
# proof. Untagged, they landed on whichever runner answered first, so a push
# either deployed or did not, depending on nothing.
#
# The runner also gives every job it takes the host's network and Docker socket,
# and now /etc/helena as well:
#
#   * a job reaches the panel on 127.0.0.1:8800 directly, because the panel uses
#     host networking too. No tunnel, and the panel stays on loopback.
#   * `docker` in such a job is the host's daemon.
#   * the compose files read that host's env files, which hold its database
#     credentials and its paths.
#
# The mount grants nothing the socket did not already grant -- it is root on the
# host -- but it is real and it is named here rather than left to be discovered.
#
# Anyone who can push to `development` can run commands on work-3, and
# anyone who can push to `staging` can run them on gpu-1. Protect both branches.
#
# Two things follow from that and are enforced rather than left as advice:
#
#   * a merge request from a fork gets no pipeline here at all (workflow rules
#     below), because opening one is not the same permission as pushing;
#   * a merge request pipeline builds the panel image but never publishes it.
#     The registry tag is the commit sha and a published tag is not rebuilt, so
#     an MR that pushed its own bytes for a sha it was then fast-forward merged
#     as would have had them deployed unexamined.
#
# What is left, and cannot be fixed in this file: the test jobs run on the same
# socket-bearing runner as the deploy jobs, because they need the image that
# runner built. Separating them needs a second, socket-less runner registered
# for the test stage -- a runner-configuration change, not a pipeline one.
#
# No CI/CD variables are required. Two are optional, and turn the smoke stage
# from skipping to asserting:
#
#   HELENA_E2E_USER, HELENA_PANEL_PASSWORD

workflow:
  rules:
    # A merge request from a fork does not get this project's runners. Every
    # runner here carries the host's Docker socket, its network and /etc/helena,
    # so a pipeline is root on work-3 or gpu-1 -- which is a deliberate trade
    # for people who can already push here, and not one to extend to whoever
    # can open a merge request. GitLab sends fork pipelines to the fork's own
    # runners by default; this refuses the case where that default is changed,
    # rather than depending on it staying set.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" &&
          $CI_MERGE_REQUEST_SOURCE_PROJECT_ID != $CI_PROJECT_ID
      when: never
    - if: $CI_COMMIT_BRANCH == "staging"
      variables:
        HELENA_CI_RUNNER: "gpu-1"
    - when: always

stages: [prepare, test, build, deploy, verify]

variables:
  # Docker-daemon-coupled jobs must share one runner. staging uses its deploy
  # host; all other pipelines retain the CPU runner by default.
  HELENA_CI_RUNNER: "work-3"
  # Both deployments serve on their own host's loopback, so this is the same
  # string for each -- the difference is which machine the job runs on.
  STAGING_URL: "https://127.0.0.1:8800"
  # The cluster registry, on a MetalLB VIP both hosts route to. It is what makes
  # a deploy a pull: the image is built once, named by commit, and every host
  # runs those exact bytes instead of compiling its own copy from a tree that
  # may or may not be current.
  # Deliberately empty here. The registry is this deployment's own address and
  # the repository is published, so it is set as a masked CI/CD variable in
  # project settings rather than committed.
  #
  # Unset, containers/deploy-platform.sh falls back to building the panel from
  # the checkout -- slower, and bytes only that host has, which is what a
  # registry exists to avoid. A deployment that wants pulls has to name its own.
  HELENA_REGISTRY: ""
  # The container the smoke stage creates and removes its account in.
  HELENA_PANEL_CONTAINER: "helena-panel"
  GIT_DEPTH: "50"

# ---------------------------------------------------------------------------
# The host guard
# ---------------------------------------------------------------------------
#
# Every job that touches a deployment names the machine it is allowed to touch,
# in HELENA_DEPLOY_HOST, and proves it is there before doing anything.
#
# A tag is a request; this is the proof. It used to be a global naming one host,
# which was safe only while one host was deployed to. Now that both are, a job
# landing on the wrong runner would deploy development over the GPU host or the
# reverse -- and gpu-1 satisfies every weaker check, because it runs a panel and
# has a Docker socket too. The name comes from the daemon, which is the host,
# not the container.
.on_its_host: &on_its_host |
  docker info > /dev/null 2>&1 || {
    echo "No Docker daemon: this job is not on a deploy runner."
    exit 1
  }
  here="$(docker info --format '{{.Name}}')"
  case "$here" in
    $HELENA_DEPLOY_HOST*) : ;;
    *)
      echo "This job is running on '$here' and is for $HELENA_DEPLOY_HOST."
      echo "Refusing: it would deploy over whatever lives on this machine."
      exit 1 ;;
  esac

# ---------------------------------------------------------------------------
# prepare
# ---------------------------------------------------------------------------

# The test suite's dependencies, installed once instead of on every push.
#
# 44% of a pipeline was apt-get and pip install: 124 seconds of the unit job's
# 284, fetching the same wheels every time. Measured, and the obvious
# alternative was measured too -- GitLab's pip cache saves 38 seconds and weighs
# 2.7 GB, so the runner would spend longer moving it than it saves.
#
# Rebuilt every pipeline and that is fine: only the requirements files are
# COPYied before the install, so Docker's layer cache makes this a no-op unless
# one of them changed. Measured at 0 seconds unchanged, 167 when they change.
#
# Never pushed. The job that uses it resolves the same pipeline-selected runner,
# and a registry round-trip for three gigabytes would undo the saving.
build the ci image:
  stage: prepare
  image: docker:27-cli
  tags: ["$HELENA_CI_RUNNER"]
  script:
    - |
      docker info > /dev/null 2>&1 || {
        echo "No Docker daemon: this job is not on the deploy host's runner."
        exit 1
      }
    - docker build -f containers/images/Containerfile.ci
        --build-arg BUILD_COMMIT=$CI_COMMIT_SHORT_SHA
        -t helena-ci:$CI_COMMIT_SHA .
    # One 2.5 GB image per pipeline, kept forever, is a host that fills up. It
    # did: twenty-three of these plus their build cache took work-3 to zero
    # bytes free, and every pipeline after that failed inside apt-get with a
    # message about /var/cache/apt rather than about disk.
    #
    # Keep the three most recent -- enough that a retry or a parallel branch
    # still hits the layer cache -- and drop the rest. Never the one just built,
    # which is what the job exists to produce.
    - |
      docker images --format '{{.Repository}}:{{.Tag}}\t{{.CreatedAt}}' \
        | grep '^helena-ci:' | sort -k2 -r | tail -n +4 | cut -f1 \
        | grep -v "helena-ci:$CI_COMMIT_SHA" \
        | xargs -r docker rmi > /dev/null 2>&1 || true
      docker builder prune -f --filter until=168h > /dev/null 2>&1 || true
      echo "helena-ci images kept: $(docker images -q helena-ci | sort -u | wc -l)"

# The database the suite tests against, on this host, on a port of its own.
#
# Not a GitLab `services:` container: this runner gives every container it
# starts the host's network, so a service gets no per-build network and its
# alias resolves nowhere -- which is how 89 tests spent weeks failing with
# `could not translate host name "postgres" to address`.
#
# And not the host's PostgreSQL either, which is the platform's own and listens
# on 127.0.0.1:55432. A probe that went looking for "a PostgreSQL around here"
# found exactly that one. The test suite creates schemas, runs migrations and
# drops databases; pointing it at the deployment's own server is a way to lose
# the deployment. So this is a separate container, with a database name the
# platform does not have, on a port the platform does not use: a connection that
# somehow lands on the wrong server fails to find the database rather than
# succeeding somewhere it should not be.
#
# It outlives the pipeline on purpose -- starting PostgreSQL is eight seconds
# every push otherwise -- and holds nothing anyone needs: each test makes its
# own uuid-named schema and drops it.
ci postgres:
  stage: prepare
  image: docker:27-cli
  tags: ["$HELENA_CI_RUNNER"]
  script:
    - *on_its_host
    - |
      if [ -z "$(docker ps -q -f name=^helena-ci-postgres$)" ]; then
        docker rm -f helena-ci-postgres > /dev/null 2>&1 || true
        docker run -d --name helena-ci-postgres --restart unless-stopped \
          -e POSTGRES_DB=helena_ci_tests \
          -e POSTGRES_USER=postgres \
          -e POSTGRES_PASSWORD=throwaway \
          -p 127.0.0.1:55433:5432 \
          --health-cmd "pg_isready -U postgres -d helena_ci_tests" \
          --health-interval 5s --health-retries 12 \
          postgres:16-alpine > /dev/null
      fi
    # Ready means accepting connections, not "the container exists". The unit
    # job starts within seconds of this one and a server still doing initdb
    # refuses every one of them.
    - |
      for _ in $(seq 1 30); do
        docker exec helena-ci-postgres pg_isready -U postgres -d helena_ci_tests \
          > /dev/null 2>&1 && exit 0
        sleep 2
      done
      echo "helena-ci-postgres never became ready"
      docker logs --tail 30 helena-ci-postgres
      exit 1

# ---------------------------------------------------------------------------
# test
# ---------------------------------------------------------------------------

# The suite the repository is judged by. Runs on every branch and every merge
# request, because a test that only runs on the deploy branch tells you about a
# regression at the moment it is most expensive to hear about it.
unit tests:
  stage: test
  # Everything preinstalled. Tagged for the pipeline-selected runner because the
  # image is built on that runner's own daemon and is not in any registry --
  # which is the point, see the prepare stage. Measured: 284 seconds to 131.
  image: helena-ci:$CI_COMMIT_SHA
  tags: ["$HELENA_CI_RUNNER"]
  # A throwaway PostgreSQL, because 89 of these tests were skipping without one
  # and nobody could see it: postgres_store, the real migration, the failpoints
  # and the concurrency parity -- the parts that only mean anything against a
  # server -- so that file sat at 23 % coverage while its tests sat unrun.
  #
  # The server the `ci postgres` job owns, named rather than discovered. The
  # discovery version asked "is there a PostgreSQL around here" and found the
  # platform's own, which is not a server a migration test may be pointed at.
  needs: ["build the ci image", "ci postgres"]
  variables:
    HELENA_TEST_DSN: "postgresql://postgres:throwaway@127.0.0.1:55433/helena_ci_tests"
    # The QC adapter records which code produced a piece of evidence, and takes
    # it from a Git checkout when nothing tells it otherwise. Inside the job
    # container the checkout belongs to another user, so git refuses it as
    # dubious ownership and the adapter raises rather than guessing -- which is
    # the right refusal in the wrong place. CI knows the commit; telling it is
    # the answer the adapter already offers.
    HELENA_QC_CODE_COMMIT: $CI_COMMIT_SHA
    # The same answer for the same question, asked by the panel rather than the
    # adapter: a control preflight binds the revision it ran under, and without
    # this it refuses with "cannot bind the deployed code revision". Measured:
    # eighteen of the newly-running tests fail on exactly that, and pass with it.
    CX_DEPLOYED_REVISION: $CI_COMMIT_SHA
  before_script:
    # A server that is up is not a server that is ready, and the suite's first
    # database test is three seconds after this job starts.
    - |
      python - <<'WAIT'
      import os, socket, sys, time

      host, port = "127.0.0.1", 55433
      deadline = time.time() + 60
      while time.time() < deadline:
          try:
              with socket.create_connection((host, port), timeout=2):
                  sys.exit(0)
          except OSError:
              time.sleep(2)
      print(f"nothing accepted a connection on {host}:{port}; "
            "see the `ci postgres` job", file=sys.stderr)
      sys.exit(1)
      WAIT
  script:
    # e2e is excluded here on purpose: it needs a deployment, and there is not
    # one yet at this point in the pipeline. It runs in `verify`, after deploy.
    - python -m pytest tests/ -q --ignore=tests/e2e --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
    expire_in: 1 week

lint:
  stage: test
  # The same image the unit tests use, so the linter is the one the lockfile
  # pins rather than whatever a fresh container resolves to.
  image: helena-ci:$CI_COMMIT_SHA
  tags: ["$HELENA_CI_RUNNER"]
  # E9 and F821 only, and that is a deliberate floor rather than a first step
  # towards style checking. They are the two that mean the code is broken: a
  # file that does not parse, and a name that does not exist. Everything else
  # flake8 reports here -- 109 findings the day this was added, mostly unused
  # imports -- is untidiness, and a gate that fails on untidiness on day one is
  # a gate somebody disables in week two.
  #
  # Both are at zero. That is what makes this a gate and not a report: it can
  # only go red because somebody added one.
  #
  # vendored code is excluded because it is not ours to fix.
  script:
    - >-
      python -m flake8 --select=E9,F821 --max-line-length=200
      --exclude=.venv,node_modules,.git,__pycache__,panel/.venv,framework/vendored
      framework panel scripts tests

frontend:
  stage: test
  image: node:22.23.1-alpine3.23
  cache:
    key: "npm-${CI_COMMIT_REF_SLUG}"
    paths: [panel/web/node_modules]
  before_script:
    - cd panel/web && npm ci --no-audit --no-fund
  script:
    # The handbook is Markdown under docs/handbook and a generated module beside
    # the routes. Regenerating it here and refusing a difference is what keeps
    # the two from drifting: an edit to the generated file is reverted by the
    # next build, and this says so at once rather than at the next deploy.
    # Regenerated and compared by digest rather than by `git diff`: this image
    # is node:alpine and has no git in it, so the diff was a command-not-found
    # every time -- a check that failed for a reason unrelated to what it
    # checks, which is worse than no check.
    - |
      before=$(sha256sum src/routes/handbook-content.ts | cut -d' ' -f1)
      npm run handbook
      after=$(sha256sum src/routes/handbook-content.ts | cut -d' ' -f1)
      if [ "$before" != "$after" ]; then
        echo "handbook-content.ts does not match docs/handbook." >&2
        echo "Run 'npm run handbook' in panel/web and commit the result." >&2
        exit 1
      fi
      echo "handbook: generated module matches its Markdown"
    - npx tsc --noEmit
    - npx vitest run
    # The same build the image performs. Failing here names the cause in ten
    # seconds; failing inside the image build names it after a base image pull.
    - npm run build

# ---------------------------------------------------------------------------
# build
# ---------------------------------------------------------------------------

# Proof that a clean checkout produces a working image, which is exactly what
# the deploy job asks its branch-selected runner to do. Doing it here means a broken
# Containerfile is caught before anything is touched on the host, rather than
# halfway through `compose up` with the old container already gone.
build the panel image:
  stage: build
  # It builds with the pipeline-selected runner's Docker socket.
  tags: ["$HELENA_CI_RUNNER"]
  image: docker:27-cli
  # The host's daemon, through the socket the runner mounts.
  #
  # Only where an image is wanted. The rules were lost when this job was
  # rewritten for the registry, so every branch push built and published a tag:
  # minutes of build time and a registry entry for work nobody deploys.
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_BRANCH == "development"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    # Same check the deploy makes, for the same reason: nothing pins this job to
    # a runner with a daemon, and `docker build` against none fails with a
    # connection error that says nothing about why.
    - |
      docker info > /dev/null 2>&1 || {
        echo "No Docker daemon: this job is not on the deploy host's runner."
        echo "Disable shared runners for this project, or tag the selected"
        echo "runner and pin this job to its pipeline affinity."
        exit 1
      }
    # Already published means already built. Both branches build the same
    # commit on this pipeline's selected runner, and a second build of it is not the same
    # bytes -- Docker builds are not reproducible by default. The second push
    # re-pointed the tag while a container elsewhere kept running the first,
    # so one commit named two different images and "this tag is those exact
    # bytes" quietly stopped being true.
    #
    # An image is built once per commit or not at all.
    - |
      if [ -n "$HELENA_REGISTRY" ]; then
        panel_image="$HELENA_REGISTRY/helena-panel:$CI_COMMIT_SHA"
      else
        panel_image="helena-panel:$CI_COMMIT_SHA"
      fi
      echo "panel image: $panel_image"
      # Already published means already built. Only askable when there is a
      # registry, and only answerable when curl exists -- docker:27-cli has
      # none, so this probe was failing silently and every pipeline rebuilt.
      # Absence of an answer is not an answer, so it says which it is.
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        echo "merge request pipeline: building, whatever the registry holds."
      elif [ -z "$HELENA_REGISTRY" ]; then
        echo "no registry configured; building locally without publishing"
      elif ! command -v curl >/dev/null 2>&1; then
        echo "curl absent; cannot tell if this commit is published, so building"
      elif curl -sf -o /dev/null \
           -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
           "https://${HELENA_REGISTRY%%/*}/v2/helena/helena-panel/manifests/$CI_COMMIT_SHA"; then
        echo "helena-panel:$CI_COMMIT_SHA is already published; not building it again"
        docker pull -q "$panel_image"
        exit 0
      fi
    # Tagged by commit, so the deploy runs a named build rather than whatever
    # `latest` happened to mean when the container restarted.
    - docker build -f containers/images/Containerfile.panel
        --build-arg BUILD_COMMIT=$CI_COMMIT_SHORT_SHA
        --build-arg BUILD_REVISION=$CI_COMMIT_SHA
        -t $panel_image .
    - docker run --rm $panel_image
        python3 -c "import panel.app"
    # The frontend is built inside the image now, so prove the pages are in the
    # bundle. A stale source tree once produced an image whose Python half was
    # current and whose pages were weeks old, and every other signal said fine.
    - |
      for page in Handbook ApiReference DeveloperReference; do
        docker run --rm $panel_image \
          sh -c "ls /workspace/campaign-x/panel/web/dist/assets | grep -q $page" \
          || { echo "$page is missing from the built frontend"; exit 1; }
      done
      echo "the built frontend carries its documentation pages"
    # Pushed only once it has been opened and looked inside. A registry tag is
    # the thing other hosts will trust, so nothing reaches it unexamined.
    #
    # And never from a merge request. The tag is the commit sha, and the job
    # above skips building when that tag already exists -- so an MR that
    # published its own bytes for a sha, and was then fast-forward merged, left
    # the deploy pulling the MR's image instead of rebuilding the branch. What
    # review approved was the diff; what would have run is whatever that
    # pipeline's Containerfile and tree produced. Building here still proves
    # the image builds and starts, which is what the MR case is for.
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        echo "merge request pipeline: built and checked, not published."
        echo "The branch pipeline publishes, after the merge."
      elif [ -n "$HELENA_REGISTRY" ]; then
        docker push "$panel_image"
      else
        echo "no registry configured; the image stays on this runner's daemon"
      fi

# ---------------------------------------------------------------------------
# deploy
# ---------------------------------------------------------------------------

# Both deploy jobs are this one, with a profile and a host. The difference
# between the two deployments is two variables, not two scripts -- the moment it
# becomes two scripts is the moment they start drifting apart.
.deploy:
  stage: deploy
  image: docker:27-cli
  needs: ["unit tests", "frontend", "build the panel image"]
  script:
    - *on_its_host
    - echo "deploying the $HELENA_PROFILE platform at $CI_COMMIT_SHORT_SHA"
    # One script, called with a profile. It holds the list of what the platform
    # is; see containers/deploy-platform.sh. Nothing about which services exist
    # is decided here.
    #
    # /etc/helena is mounted into this job by the runner: the compose files need
    # the host's env files, which hold its database credentials and its paths.
    # That grants the job nothing it did not already have -- it holds the Docker
    # socket, which is root on this machine -- but it is a real mount and it is
    # named in containers/compose/runner.compose.yaml.
    - |
      test -d /etc/helena || {
        echo "/etc/helena is not mounted into this job."
        echo "The runner needs it; see containers/compose/runner.compose.yaml."
        exit 1
      }
    - HELENA_COMMIT_FULL=$CI_COMMIT_SHA sh containers/deploy-platform.sh
        "$HELENA_PROFILE" "$CI_COMMIT_SHORT_SHA"
    # `up -d` returns when containers start, not when the panel serves.
    - |
      for _ in $(seq 1 60); do
        wget -q --no-check-certificate -O /dev/null "$STAGING_URL/" && break
        sleep 5
      done
      wget -q --no-check-certificate -O /dev/null "$STAGING_URL/" \
        || { echo "the panel did not answer within five minutes"; exit 1; }
    - |
      if [ -n "$HELENA_REGISTRY" ]; then
        panel_image="$HELENA_REGISTRY/helena-panel:$CI_COMMIT_SHA"
      else
        panel_image="helena-panel:$CI_COMMIT_SHA"
      fi
      docker image inspect "$panel_image" \
        --format 'deployed {{index .Config.Labels "org.opencontainers.image.revision"}}'

deploy to work-3:
  extends: .deploy
  tags: [work-3]
  variables:
    HELENA_DEPLOY_HOST: "work-3"
    HELENA_PROFILE: "nogpu"
  environment:
    name: development
    url: https://work-3:8800
  rules:
    - if: $CI_COMMIT_BRANCH == "development"

deploy to gpu-1:
  extends: .deploy
  tags: [gpu-1]
  variables:
    HELENA_DEPLOY_HOST: "gpu-1"
    HELENA_PROFILE: "gpu"
  environment:
    name: staging
    url: https://gpu-1:8800
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"

# ---------------------------------------------------------------------------
# the toolchain
# ---------------------------------------------------------------------------

# Compile the two villa images at the commit the lock pins, and publish them
# to the internal registry.
#
# Manual, because this is the hour of volume-cartographer that everything else
# here exists to avoid paying twice. It is not part of a deploy: a deploy that
# might spend an hour is a deploy nobody can time.
#
# Why a job at all, rather than somebody building it on the host: nothing on
# these machines is hand-prepared, and an image built by hand is one whose
# provenance is a person's memory. build-worker.sh already pins both -- commit,
# tree, and the fetch check the tree hash before the toolchain is installed --
# so this runs that script rather than restating its build arguments here,
# where they would drift.
#
# BASE_IMAGE without the registry prefix on purpose. Prefixed, the script reads
# the name as one to pull rather than build, which is right for a deploy and
# wrong for the job whose whole purpose is producing it.
build and publish the villa toolchain:
  stage: build
  tags: [gpu-1]
  image: docker:27-cli
  variables:
    HELENA_DEPLOY_HOST: "gpu-1"
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
      when: manual
      allow_failure: true
  timeout: 3h
  script:
    - *on_its_host
    - |
      # The lock is this job's subject, so it is read here rather than assumed,
      # and by the same containerised route build-worker.sh uses -- this image
      # has no python either.
      read_pin() {
        docker run --rm -i "${HELENA_PYTHON_IMAGE:-python:3.11-slim}" python3 - \
          "$(cat containers/images/scrollfiesta/locks/source-lock.json)" "$1" <<'PY_PIN'
      import json, sys
      print(json.loads(sys.argv[1])[sys.argv[2]]["commit"])
      PY_PIN
      }
      villa_commit="$(read_pin volume_cartographer)"
      villa_python_commit="$(read_pin villa_python)"
      test -n "$villa_commit" -a -n "$villa_python_commit" || {
        echo "the lock did not read; refusing to build an unpinned toolchain" >&2
        exit 2
      }
      echo "volume_cartographer $villa_commit"
      echo "villa_python        $villa_python_commit"
    - |
      # One script, already holding every pin. It builds whichever of the two
      # is absent or not at the locked commit, and leaves both under their
      # local names.
      BASE_IMAGE=helena-villa:local \
      HELENA_VILLA_PYTHON_IMAGE=helena-villa-python:local \
      sh containers/build-worker.sh "$PWD" "helena-worker-cpp:toolchain-$CI_COMMIT_SHORT_SHA"
    - |
      # Published by the commit they carry, read off the image rather than off
      # the lock: what is pushed is what was built, and if those two ever
      # disagree the tag should say what is in the layers.
      publish_internal() {
        local_image="$1" repo="$2"
        [ -n "$HELENA_REGISTRY" ] || {
          echo "no internal registry configured; $repo stays on this daemon"
          return 0
        }
        carries="$(docker image inspect "$local_image" \
          --format '{{index .Config.Labels "org.helena.villa.commit"}}' 2>/dev/null)"
        test -n "$carries" || { echo "$local_image carries no villa commit" >&2; return 1; }
        short="$(printf %.12s "$carries")"
        for name in "villa-$short" local; do
          docker tag "$local_image" "$HELENA_REGISTRY/$repo:$name"
          # Bounded, and checked. `docker push` retries a refused layer on
          # its own with no cap: the first run of this job spent an hour re-
          # sending the 8.4 GB layer of helena-villa-python into a registry
          # answering 500, and only the 3 h job timeout would have stopped it.
          # A push that has not finished in 25 minutes is not going to, so it
          # is killed here with the daemon's own reason left in the log -- and
          # a push that "succeeded" is still asked about: the registry's own
          # tag list is the only thing that says the bytes are there.
          timeout 1500 docker push "$HELENA_REGISTRY/$repo:$name" || {
            echo "pushing $repo:$name did not finish; the registry refused or" >&2
            echo "stalled -- see the daemon's reason above (a 500 on a large" >&2
            echo "layer is its storage or an upload limit, not this host)" >&2
            exit 1
          }
          listed="$(docker run --rm "${HELENA_CURL_IMAGE:-curlimages/curl:8.11.1}" \
            --silent --fail "https://${HELENA_REGISTRY%%/*}/v2/${HELENA_REGISTRY#*/}/$repo/tags/list" 2>/dev/null || true)"
          case "$listed" in
            *"\"$name\""*) ;;
            *) echo "$repo:$name is not in the registry's tag list after the push:" >&2
               echo "  $listed" >&2
               exit 1 ;;
          esac
        done
        echo "published $repo at $short, and the registry lists it"
      }
      publish_internal helena-villa:local helena-villa
      publish_internal helena-villa-python:local helena-villa-python
    - |
      echo "Both images are on this host and in the internal registry."
      echo "Run 'publish images to docker hub' to put them on Docker Hub too."

# ---------------------------------------------------------------------------
# publish
# ---------------------------------------------------------------------------

# A stranger's install pulls these once they exist -- see
# containers/deploy-platform.sh's HELENA_PUBLIC_REGISTRY. Nothing publishes
# them yet: this is the job that will, and it stays `when: manual` on purpose.
# A push to a public registry is not something a green pipeline should decide
# to do on its own, and DOCKERHUB_USER / DOCKERHUB_TOKEN are unset until a
# maintainer adds them as masked, protected CI/CD variables -- absent either,
# the job says so and exits rather than failing the pipeline it hangs off.
publish images to docker hub:
  stage: verify
  tags: [gpu-1]
  image: docker:27-cli
  needs: ["deploy to gpu-1"]
  variables:
    HELENA_DEPLOY_HOST: "gpu-1"
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
      when: manual
      allow_failure: true
  script:
    - *on_its_host
    - |
      if [ -z "$DOCKERHUB_USER" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
        echo "DOCKERHUB_USER and DOCKERHUB_TOKEN are not both set as CI/CD"
        echo "variables on this project; add them (masked, protected) to publish."
        exit 0
      fi
      echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USER" --password-stdin
    - version="$(cat VERSION)"
    - |
      # By resolved image ID rather than by guessing the local tag a deploy
      # happened to name -- the same reason deploys verify themselves that way.
      # A container not running on this host (control-tunnel joins a *second*
      # machine; nothing here runs it) is built fresh instead: it has no
      # dependencies and costs seconds.
      publish_running() {
        container="$1" repo="$2"
        id="$(docker inspect --format '{{.Image}}' "$container" 2>/dev/null)" || {
          echo "$container is not running here; skipping helena-$repo" >&2
          return 0
        }
        docker tag "$id" "docker.io/limegs/helena-$repo:$version"
        docker tag "$id" "docker.io/limegs/helena-$repo:latest"
        docker push "docker.io/limegs/helena-$repo:$version"
        docker push "docker.io/limegs/helena-$repo:latest"
      }
      publish_running helena-panel panel
      publish_running helena-segment worker-cpp
      # One per card, and the index is the device's own -- gpu-1 itself runs
      # its one card as helena-gpu-runtime-1, not -0. Whichever is first to
      # answer `docker ps` is published; none running falls through to the
      # same not-running skip as every other container here.
      gpu_runtime="$(docker ps --filter 'name=^helena-gpu-runtime-' --format '{{.Names}}' | head -1)"
      publish_running "${gpu_runtime:-helena-gpu-runtime-0}" worker-gpu
    - |
      # Neither runs persistently on this host by default -- backup only
      # starts where HELENA_BACKUP_S3 is set, and control-tunnel joins a
      # *second* machine -- so both are built fresh here instead of read off
      # a container that may not exist. Cheap: neither depends on villa.
      publish_built() {
        containerfile="$1" repo="$2"; shift 2
        docker build -q -f "$containerfile" --build-arg BUILD_COMMIT="$CI_COMMIT_SHA" "$@" -t "docker.io/limegs/helena-$repo:$version" -t "docker.io/limegs/helena-$repo:latest" .
        docker push "docker.io/limegs/helena-$repo:$version"
        docker push "docker.io/limegs/helena-$repo:latest"
      }
      publish_built containers/images/Containerfile.backup backup --build-arg BASE_IMAGE=postgres:16-alpine
      publish_built containers/images/Containerfile.control-tunnel control-tunnel
    - |
      # The toolchain images, which nothing published before -- and they are
      # the expensive half: a stranger's first install compiled volume-
      # cartographer for an hour because the only copies lived on the hosts
      # that had already done so.
      #
      # Neither fits the two helpers above. They do not run as containers --
      # they are what the workers are built FROM, not services -- so there is
      # no container for publish_running to read; and publish_built would
      # recompile villa inside this job, which is the cost being removed.
      # What is published is the image this host already has.
      #
      # Checked first, against the lock rather than against hope. An image
      # whose label disagrees is skipped, not pushed: publishing a stale
      # toolchain as `latest` would hand every fresh install the wrong one --
      # the same failure the build gate exists to stop, one registry further
      # out. The lock is read the way deploy-platform.sh reads it, by handing
      # the file's contents to python rather than mounting a path that does
      # not mean the same thing inside this job as it does on the host.
      lock_commit() {
        docker run --rm -i "${HELENA_PYTHON_IMAGE:-python:3.11-slim}" python3 - \
          "$(cat containers/images/scrollfiesta/locks/source-lock.json)" "$1" <<'PY_LOCK'
      import json, sys
      print(json.loads(sys.argv[1])[sys.argv[2]].get("commit", ""))
      PY_LOCK
      }
      publish_toolchain() {
        image="$1" repo="$2" entry="$3"
        docker image inspect "$image" >/dev/null 2>&1 || {
          echo "$image is not on this host; skipping helena-$repo" >&2
          return 0
        }
        carries="$(docker image inspect "$image" \
          --format '{{index .Config.Labels "org.helena.villa.commit"}}' 2>/dev/null)"
        pinned="$(lock_commit "$entry")"
        if [ -z "$carries" ] || [ -z "$pinned" ] || [ "$carries" != "$pinned" ]; then
          echo "$image carries ${carries:-no villa commit} and the lock pins ${pinned:-nothing readable};" >&2
          echo "  skipping helena-$repo rather than publishing a stale toolchain" >&2
          return 0
        fi
        # Three names for one image. $version is what a deploy at this release
        # asks for; villa-<commit> is the toolchain's own identity, which is an
        # upstream sha and so means the same thing to every clone, unlike one
        # from this project's history; latest is the stranger's default.
        short="villa-$(printf %.12s "$carries")"
        for name in "$version" "$short" latest; do
          docker tag "$image" "docker.io/limegs/helena-$repo:$name"
          docker push "docker.io/limegs/helena-$repo:$name"
        done
      }
      publish_toolchain "${HELENA_REGISTRY:+${HELENA_REGISTRY%/}/}helena-villa:local" villa volume_cartographer
      publish_toolchain "${HELENA_VILLA_PYTHON_IMAGE:-helena-villa-python:local}" villa-python villa_python

# ---------------------------------------------------------------------------
# verify
# ---------------------------------------------------------------------------

# The deployment answering an HTTP request is not the same as the platform
# working. This asks it the questions the end-to-end suite asks: that every
# phase explains its state, that the gates still refuse what they are supposed
# to refuse, that the arithmetic on each page closes.
# Runs against whichever deployment this branch just produced, on that host's
# own loopback. Two jobs rather than one, because each is pinned to its machine
# and named after it -- a single job that guessed would be a job that one day
# smoke-tests the wrong platform and passes.
.smoke:
  stage: verify
  # It reaches the panel on this host's loopback.
  # The docker CLI, because this job creates its own account on the deployment
  # through the panel container. The end-to-end suite itself needs only pytest
  # and the standard library -- it used to install panel/requirements.txt,
  # which is minutes of torch and scipy for a suite that speaks HTTP.
  image: docker:27-cli
  variables:
    # Host network, and the panel listens on the host's loopback. Nothing is
    # exposed for CI to reach it.
    HELENA_E2E_PANEL: "https://127.0.0.1:8800"
    HELENA_PANEL_TLS_INSECURE: "1"
    # A skip is a decision, not an accident. See tests/e2e/conftest.py: any
    # skip outside the declared list fails the job, and a run where nothing
    # passed fails too.
    HELENA_E2E_NO_SKIP: "1"
    # The scroll this run's mission selects. It was only ever set on the heavy
    # job, so `$HELENA_E2E_SCROLL` expanded to nothing here and the mission was
    # created with no scrolls at all -- which nobody saw, because the test that
    # needs one skipped for want of a campaign binding. With the binding in
    # place it stopped skipping and refused the P1 wave for the wrong reason:
    # "has no scrolls" instead of the campaign blocker it exists to check.
    HELENA_E2E_SCROLL: "PHerc0826"
    HELENA_E2E_USER: "ci-$CI_PIPELINE_ID"
    # The suite defaults to a mission called `test`, and defaulting to something
    # that has to already exist is the same failure as defaulting to somebody
    # having set a password: it works on the deployment it was written against
    # and nowhere else. work-3 was rebuilt from nothing and had no such
    # mission, so every phase-summary call came back 404 and fourteen tests
    # errored in setup pointing at the panel rather than at the gap.
    #
    # The job makes what it needs, exactly as it does for its account.
    HELENA_E2E_MISSION: "ci-$CI_PIPELINE_ID"
  before_script:
    # No interpreter installed here on purpose. Everything this job runs in
    # Python runs in a container that already has the right one: the setup below
    # in the panel's, the suite itself in helena-ci's. See the script.
    - *on_its_host
    # The account this run will use, made for this run and deleted after it.
    #
    # Generated rather than configured: the smoke stage previously had no
    # credentials, so all 44 tests skipped and it reported success. A
    # verification that depends on somebody having remembered to set a variable
    # is a verification that will one day be skipped silently -- so it makes
    # its own, through the panel's auth contract inside the container, which
    # works whether or not the deployment already has accounts.
    - export HELENA_PANEL_PASSWORD="$(head -c 24 /dev/urandom | base64 | tr -dc 'a-zA-Z0-9' | head -c 24)"
    # The credentials travel as container environment, not interpolated into
    # the source of the -c program: a password is data, and putting it through
    # two layers of shell quoting is how it ends up in a log or breaks on a
    # character nobody thought about.
    - |
      docker exec -e U="$HELENA_E2E_USER" -e P="$HELENA_PANEL_PASSWORD" \
        "$HELENA_PANEL_CONTAINER" python3 -c "
      import os, sys
      sys.path.insert(0, '/workspace/campaign-x')
      from pathlib import Path
      from framework.contracts import auth
      auth.create_user(Path('/state/auth'), os.environ['U'], os.environ['P'], by='ci')
      "
    # The mission this run works in, campaign-bound.
    #
    # It used to be written with `mission.create` and no binding, which is a
    # perfectly good mission and the wrong one for this job: four of these tests
    # verify the campaign gates -- readiness, blockers, the small-surface
    # diagnostic, the refusal of a P1 wave -- and a mission with no campaign
    # binding makes all four skip. They had never actually run, because
    # collection aborted on an import before reaching them; the moment the suite
    # started working they turned into failures, correctly, since a verification
    # job that skips reports success without looking.
    #
    # Through the HTTP route rather than the contract, because the binding is
    # the panel's to derive: the policy id, the hash of its bytes and the
    # deployed revision come from the running deployment, and a second copy of
    # that derivation here is a second thing to keep true.
    - |
      docker exec -e M="$HELENA_E2E_MISSION" -e S="$HELENA_E2E_SCROLL" \
        -e U="$HELENA_E2E_USER" -e P="$HELENA_PANEL_PASSWORD" \
        "$HELENA_PANEL_CONTAINER" python3 -c "
      import os, sys
      sys.path.insert(0, '/workspace/campaign-x/scripts/harness')
      from panel_client import Panel, PanelError
      panel = Panel('https://localhost:8800', trust='/state/tls/panel.crt')
      panel.sign_in(os.environ['U'], os.environ['P'])
      try:
          panel.call('POST', '/api/missions', {
              'mission_id': os.environ['M'],
              'name': 'smoke ' + os.environ['M'],
              'scrolls': [os.environ['S']],
              'description': 'created by the smoke stage',
              'campaign_kind': 'FIRST_LETTERS_DISCOVERY',
          })
          print('mission', os.environ['M'], 'created (campaign-bound)')
      except PanelError as refused:
          if refused.status != 400:
              raise
          print('mission already present:', str(refused)[:120])
      "
  script:
    # Run inside the image the rest of the suite already runs in, rather than on
    # the Alpine executor.
    #
    # The suite "needs only pytest and the standard library" stopped being true:
    # the control module imports numpy and tifffile at module scope, and an
    # ImportError during collection aborts the whole run, so this job verified
    # zero tests and reported it as a failure to import. `py3-numpy` fixed the
    # first one and the second appeared; tifffile is not an Alpine package, and
    # pip in `docker:27-cli` is itself broken (its pyexpat does not match the
    # image's expat). Chasing imports one at a time was the wrong move -- the
    # dependency set the tests need is the one helena-ci already has.
    #
    # Host networking because the panel listens on this host's loopback, and the
    # HELENA_* variables because the account and mission were made out here.
    #
    # Copied in rather than bind-mounted. `$CI_PROJECT_DIR` is a path inside this
    # executor container, and `-v` is read by the host's daemon, which has no
    # such path -- it would have mounted a new empty directory and collected no
    # tests at all.
    # `grep '^HELENA_'` matched any *line* beginning with HELENA_, and `env`
    # prints multi-line values raw -- so a commit message with a line starting
    # `HELENA_REGISTRY ...` became a variable named after half a sentence, and
    # docker refused the file: "variable '...' contains whitespaces". A CI job
    # that fails on the prose in a commit message is a job nobody can predict.
    # Require the shape of an assignment: a name, then =, and nothing else.
    - env | grep -E '^HELENA_[A-Za-z0-9_]+=' > /tmp/e2e.env
    - |
      set -e
      docker create --name "e2e-$CI_JOB_ID" --network host \
        --env-file /tmp/e2e.env -w /src \
        "helena-ci:$CI_COMMIT_SHA" python -m pytest tests/e2e -q -rs > /dev/null
      # `/.` copies the contents. `-w /src` has already created the directory,
      # and copying the directory itself into an existing one nests it.
      docker cp "$CI_PROJECT_DIR/." "e2e-$CI_JOB_ID:/src"
      docker start -a "e2e-$CI_JOB_ID"
  after_script:
    # Always, including when the suite failed: a deployment must not accumulate
    # an account, a mission or a stopped container per pipeline.
    - docker rm -f "e2e-$CI_JOB_ID" > /dev/null 2>&1 || true
    - |
      docker exec -e U="$HELENA_E2E_USER" "$HELENA_PANEL_CONTAINER" python3 -c "
      import os, shutil, sys
      sys.path.insert(0, '/workspace/campaign-x')
      from pathlib import Path
      from framework.contracts import auth
      root, me = Path('/state/auth'), os.environ['U']
      others = [u for u in auth.users(root) if u != me]
      if others:
          auth.delete_user(root, me)
          print('removed', me)
      else:
          # delete_user refuses to remove the last account -- rightly, it would
          # lock everyone out. But when the last account is this job's own, the
          # honest end state is the one before the job ran: none, and the
          # loopback bootstrap open again. Leaving it would strand a live
          # credential whose password existed only in a job environment.
          shutil.rmtree(root, ignore_errors=True)
          print('removed', me, 'and left no accounts, as before this run')
      " || echo "could not remove $HELENA_E2E_USER; remove it by hand"
    # And the mission, so a deployment does not accumulate one per pipeline.
    # Always, including after a failure: the run that failed is the one whose
    # leftovers nobody goes back for.
    - |
      docker exec -e M="$HELENA_E2E_MISSION" "$HELENA_PANEL_CONTAINER" python3 -c "
      import os, shutil
      from pathlib import Path
      doomed = Path(os.environ.get('CX_RUNS', '/runs')) / os.environ['M']
      if doomed.is_dir() and (doomed / 'MISSION.json').is_file():
          shutil.rmtree(doomed)
          print('removed mission', os.environ['M'])
      " || echo "could not remove $HELENA_E2E_MISSION; remove it by hand"


smoke on work-3:
  extends: .smoke
  tags: [work-3]
  needs: ["deploy to work-3"]
  variables:
    HELENA_DEPLOY_HOST: "work-3"
  rules:
    - if: $CI_COMMIT_BRANCH == "development"

smoke on gpu-1:
  extends: .smoke
  tags: [gpu-1]
  needs: ["deploy to gpu-1"]
  variables:
    HELENA_DEPLOY_HOST: "gpu-1"
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"

# ---------------------------------------------------------------------------
# heavy
# ---------------------------------------------------------------------------

# The only stage that exercises the science: a real render from a real volume
# and a real detector reading it, on the only machine with a GPU.
#
# Manual and scheduled rather than per-push. It costs about half an hour of two
# cards that are usually busy with QC, and it queues work the control plane
# records -- that is not something to do on every commit.
#
# It runs on the gpu-1 runner, which is also what `staging` now deploys to -- so
# this stage exercises the deployment the same branch just produced, rather than
# whatever happened to be on that machine.
heavy:
  stage: verify
  image: docker:27-cli
  tags: [gpu-1]
  needs: []
  rules:
    # Never on a push. A scheduled pipeline, or somebody pressing the button.
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == "staging"
      when: manual
      allow_failure: true
  timeout: 90m
  variables:
    HELENA_E2E_PANEL: "https://127.0.0.1:8800"
    HELENA_PANEL_TLS_INSECURE: "1"
    HELENA_E2E_HEAVY: "1"
    # Same rule as smoke, and it bites harder here. These two tests skip when
    # P3 has published no sheet to render or P4 no stack to screen -- and a
    # heavy run that skipped both would burn a scheduled slot, report green,
    # and have proved nothing about the science. Those reasons are not in the
    # allowed list, so they fail.
    HELENA_E2E_NO_SKIP: "1"
    HELENA_E2E_SCROLL: "PHerc0826"
    # Read off this deployment's own control plane rather than typed here: the
    # snapshot records the URI the surfaces were actually grown from, and a
    # second copy of it in CI is a second thing to keep true.
    HELENA_E2E_CHECKPOINT: "/models/timesformer_GP_scroll1/model.safetensors"
    HELENA_E2E_PIXEL_UM: "9.362"
    HELENA_E2E_USER: "ci-heavy-$CI_PIPELINE_ID"
    HELENA_DEPLOY_HOST: "gpu-1"
  before_script:
    # Same as the smoke job: nothing Python runs on the executor itself.
    - *on_its_host
    - export HELENA_E2E_VOLUME_URL="$(docker exec helena-postgres psql -U campaignx -d campaignx -tAc
        "select ct_uri from segment_source_snapshots where ct_uri like 'https%' limit 1" | tr -d '[:space:]')"
    - test -n "$HELENA_E2E_VOLUME_URL" || { echo "no https volume in the control plane"; exit 1; }
    - export HELENA_PANEL_PASSWORD="$(head -c 24 /dev/urandom | base64 | tr -dc 'a-zA-Z0-9' | head -c 24)"
    - |
      docker exec -e U="$HELENA_E2E_USER" -e P="$HELENA_PANEL_PASSWORD" \
        "$HELENA_PANEL_CONTAINER" python3 -c "
      import os, sys
      sys.path.insert(0, '/workspace/campaign-x')
      from pathlib import Path
      from framework.contracts import auth
      auth.create_user(Path('/state/auth'), os.environ['U'], os.environ['P'], by='ci')
      "
  script:
    # Same image and the same copy-in as the smoke job above, for the same
    # reasons.
    # `grep '^HELENA_'` matched any *line* beginning with HELENA_, and `env`
    # prints multi-line values raw -- so a commit message with a line starting
    # `HELENA_REGISTRY ...` became a variable named after half a sentence, and
    # docker refused the file: "variable '...' contains whitespaces". A CI job
    # that fails on the prose in a commit message is a job nobody can predict.
    # Require the shape of an assignment: a name, then =, and nothing else.
    - env | grep -E '^HELENA_[A-Za-z0-9_]+=' > /tmp/e2e.env
    - |
      set -e
      docker create --name "e2e-$CI_JOB_ID" --network host \
        --env-file /tmp/e2e.env -w /src \
        "helena-ci:$CI_COMMIT_SHA" \
        python -m pytest tests/e2e -q -rs -k "render_is_verified or detector_reads" > /dev/null
      # `/.` copies the contents. `-w /src` has already created the directory,
      # and copying the directory itself into an existing one nests it.
      docker cp "$CI_PROJECT_DIR/." "e2e-$CI_JOB_ID:/src"
      docker start -a "e2e-$CI_JOB_ID"
  after_script:
    - docker rm -f "e2e-$CI_JOB_ID" > /dev/null 2>&1 || true
    - |
      docker exec -e U="$HELENA_E2E_USER" "$HELENA_PANEL_CONTAINER" python3 -c "
      import os, sys
      sys.path.insert(0, '/workspace/campaign-x')
      from pathlib import Path
      from framework.contracts import auth
      auth.delete_user(Path('/state/auth'), os.environ['U'])
      " || echo "could not remove $HELENA_E2E_USER"
