# P2's scientific screen: one instance per GPU.
#
#   HELENA_QC_DEVICE=0 docker compose -p helena-qc-0 \
#     --env-file /etc/helena/surface-qc.env \
#     -f containers/compose/surface-qc.compose.yaml up -d
#   HELENA_QC_DEVICE=1 docker compose -p helena-qc-1 ... up -d
#
# The project name is what makes two of these coexist; everything that must
# differ between them -- container name, GPU, run root, worker id -- is derived
# from HELENA_QC_DEVICE. An eight-card rig is the same two lines eight times,
# which is worth saying out loud because the alternative people reach for is
# eight copies of this file.
#
# Concurrency was always safe: claim_qc takes one job under FOR UPDATE SKIP
# LOCKED with an atomic lease.
name: helena-qc

services:
  surface-qc:
    # The phase runtime, which is helena-gpu-runtime plus tifffile plus this
    # repository baked in. QC needs the adapter, the watch script and the frozen
    # profile; taking them from the image rather than a mounted checkout is what
    # lets a machine run this with nothing on its disk. The model underneath is
    # the same model, byte for byte, that every past verdict was issued with.
    image: ${HELENA_QC_IMAGE:-helena-worker-gpu:${HELENA_VERSION:-0.24.1}}
    # Not root. Every image in this fleet ran as uid 0, so a bug in a runner
    # -- a tar, a zarr reader, a model loader eating an attacker-shaped file --
    # had the whole container and every volume mounted into it. The volumes are
    # 1000:1000 on the hosts (see containers/README-nonroot.md); a host that
    # has not done that chown will see permission errors on first start rather
    # than silent damage.
    #
    # no-new-privileges as well: it costs nothing here and removes setuid as a
    # way back up.
    user: "${HELENA_RUN_AS:-1000:1000}"
    security_opt:
      - no-new-privileges:true
    container_name: helena-gpu-runtime-${HELENA_QC_DEVICE:-0}
    restart: unless-stopped
      # A ceiling, because this host has already lost PostgreSQL to a full
      # disk. Docker's default json-file driver has no limit at all: a
      # worker in a retry loop writes until the volume the database is on
      # runs out, and nothing in this stack was bounded before.
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}
    network_mode: host
    env_file:
      - ${HELENA_QC_ENV:-/etc/helena/surface-qc.env}
      # Optional, and the same form the panel already uses: credentials live
      # in the control plane, and a missing file here stopped the whole stack
      # from starting on any host that keeps none.
      - path: ${HELENA_QC_AWS_ENV:-/etc/helena/aws.env}
        required: false
    environment:
      # Evidence provenance belongs to this immutable deployment, not to the
      # long-lived host env file.  deploy-platform.sh resolves and exports the
      # full SHA before compose starts either worker.
      HELENA_QC_CODE_COMMIT: "${HELENA_COMMIT_FULL:-${HELENA_QC_CODE_COMMIT:?set in surface-qc.env}}"
      # Leases and receipts name a worker. Two instances under one name make the
      # record unable to say which card measured a surface.
      QC_WORKER_ID: ${HELENA_QC_HOST_ID:?set it to this machine's name}-gpu${HELENA_QC_DEVICE:-0}-surface-qc
      # Where the checkpoint sits inside the volume: the panel downloads under
      # the model family the profile names, so the default is the path a fresh
      # deployment ends up with and needs no configuration. A deployment that
      # already sets this in its env file keeps whatever it says.
      HELENA_QC_CHECKPOINT: ${HELENA_QC_CHECKPOINT:-/models/timesformer_GP_scroll1/model.safetensors}
      # This worker does not own its card. On gpu-1 two llama.cpp servers hold
      # 9,264 MiB of the 12,288 across both boards, and every QC job that
      # reached ink screening died with CUDA out of memory -- after paying for
      # a full render, because the render succeeds and only inference finds
      # there is no room.
      #
      # Below this many MiB free on the best card, a claim is refused before
      # the executor runs and the receipt says GPU_MEMORY_EXHAUSTED with the
      # number it saw, instead of "command failed with exit code 1".
      #
      # 2048 is a floor, not a measurement: the observed failure had TimeSformer
      # at 815 MiB allocated when it died asking for 40 more, so the true
      # requirement is above that and has not been measured with the cards free.
      # Set it from a measured run when there is one.
      QC_MINIMUM_FREE_VRAM_MIB: ${QC_MINIMUM_FREE_VRAM_MIB:-2048}
    gpus:
      - driver: nvidia
        device_ids: ["${HELENA_QC_DEVICE:-0}"]
        capabilities: [gpu]
    volumes:
      # The models volume, read-only. It was a single file bind-mounted from
      # the host, so bringing up QC on a new machine meant putting a 152 MB
      # checkpoint somewhere by hand first and saying where. The panel fills
      # this volume from Hugging Face -- the profile names the hash, and the
      # repository publishes it -- and the worker verifies the same hash before
      # it measures anything. A host path still works: set HELENA_QC_MODELS.
      - ${HELENA_QC_MODELS:-helena-models}:/models:ro
      - ${HELENA_QC_POSTGRES_ENV:?set HELENA_QC_POSTGRES_ENV to the postgres credentials}:/run/secrets/postgres.env:ro
      # Its own run root. Two workers staging surfaces into one directory write
      # the same paths.
      - ${HELENA_QC_RUN_ROOT:?set HELENA_QC_RUN_ROOT}/gpu${HELENA_QC_DEVICE:-0}:/artifacts/qc-runtime
      # Surfaces published to a local artifact root on this host, so a URI that
      # names a container path still resolves.
      # The whole artifacts volume at /artifacts, the way the segment stack
      # mounts it -- not its surfaces subdirectory at /artifacts/surfaces.
      # Mounting the subdirectory meant the two stacks had to agree on two
      # things instead of one, and they stopped agreeing: segment published
      # into the named volume and QC read a host bind that was empty, so
      # every QC job failed with a FileNotFoundError whose path the receipt
      # scrubs. One mount, one place, and the surface a worker published is
      # the surface the next worker opens.
      - ${HELENA_QC_ARTIFACTS:?set HELENA_QC_ARTIFACTS to helena-artifacts}:/artifacts
      # P8 publishes merged children under a separate durable namespace and
      # immediately queues the same physical QC used by P1 surfaces.  Without
      # this mount that automatic job can be claimed but can never materialize
      # its input.  Read-only: QC publishes evidence elsewhere and must not
      # rewrite the scientific artifact it is measuring.
      - ${HELENA_QC_RECONSTRUCTIONS:?set HELENA_QC_RECONSTRUCTIONS}:/artifacts/reconstruction-v1:ro
    command:
      - sh
      - /workspace/campaign-x/framework/stages/01-segmentation/scripts/run_with_postgres_control_plane.sh
      - sh
      - /workspace/campaign-x/framework/stages/01-segmentation/scripts/run_surface_qc_watch.sh

volumes:
  helena-models:
    name: ${HELENA_MODELS_VOLUME:-helena-models}
    external: true
  # External, and the same volume the segment stack publishes into: a surface
  # this stack reads was written by that one, so naming it here rather than
  # declaring a second is what keeps them the same bytes.
  helena-artifacts:
    name: ${HELENA_ARTIFACTS_VOLUME:-helena-artifacts}
    external: true
