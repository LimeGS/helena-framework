# P4, P5, P7 and P8: the ink-fleet worker.
#
#   docker compose --env-file /etc/helena/ink.env \
#                  -f containers/compose/ink.compose.yaml up -d
#
# Rendering wants a GPU and so does the detector, so this one takes a card. Which
# card is a per-host fact and lives in the env file, not here.
#
# One instance per slot, because one instance served five phases in series. On a
# two-card host that meant a second person's P5 waited for the first even with a
# card idle, and a long render blocked every P7 and P8 behind it. The queue was
# never the bottleneck -- it hands work to as many workers as ask for it. There
# was one asker.
#
# A second slot, on the other card:
#
#   HELENA_INK_SLOT=1 HELENA_INK_DEVICE=0 docker compose -p helena-ink-1 \
#     --env-file /etc/helena/ink.env -f containers/compose/ink.compose.yaml up -d
#
# -p is required: the project name is what keeps the two from being recreations
# of each other. Slots may share a card -- rendering is mostly IO -- but two
# detectors will not both fit in 6 GiB, which is why this is a decision per host
# rather than a number this file picks.
#
# The 9 um detector is a slot too, and this is the whole of it:
#
#   HELENA_INK_SLOT=9um HELENA_INK_DEVICE=0 \
#   HELENA_INK_IMAGE=helena-worker-gpu:local \
#   HELENA_RUNTIME_IMAGE=helena-ink-9um \
#   HELENA_INK_PHASES=P5 \
#     docker compose -p helena-ink-9um --env-file /etc/helena/ink.env \
#       -f containers/compose/ink.compose.yaml up -d
#
# No second file, because nothing about the service differs -- same worker, same
# queue, same mounts. What differs is which image it is and which image it says
# it is, and both were already variables. HELENA_RUNTIME_IMAGE must name the
# lane image the worker carries rather than the composed image it runs as: the
# lane declares `helena-ink-9um`, and a worker labelled helena-worker-gpu
# would refuse its own job by name.
#
# The two are one suffix apart and both mistakes have now been made:
#
#   * HELENA_INK_IMAGE=helena-ink-9um crash-looped for 27 hours reporting
#     `can't open file '.../ink_worker.py'`. The lane image carries /opt/villa
#     and no repository; it answers that itself now, naming both variables.
#   * HELENA_RUNTIME_IMAGE=helena-worker-gpu is the quiet one -- the worker
#     starts, refuses every 9 um job by name, and looks idle. It refuses to
#     start at all now.
#
# Note also `container_name: helena-ink-${HELENA_INK_SLOT}`: with SLOT=9um the
# container is called helena-ink-9um whichever image is inside it, so the name
# is no evidence about which one that is.
name: helena-ink

services:
  ink:
    image: ${HELENA_INK_IMAGE:-helena-worker-gpu:${HELENA_VERSION:-0.24.1}}
    # Not root. Every image in this fleet ran as uid 0, so a bug in a runner
    # -- a tar, a zarr reader, a model loader eating an attacker-shaped file --
    # had the whole container and every volume mounted into it. The volumes are
    # 1000:1000 on the hosts (see containers/README-nonroot.md); a host that
    # has not done that chown will see permission errors on first start rather
    # than silent damage.
    #
    # no-new-privileges as well: it costs nothing here and removes setuid as a
    # way back up.
    user: "${HELENA_RUN_AS:-1000:1000}"
    security_opt:
      - no-new-privileges:true
    container_name: helena-ink-${HELENA_INK_SLOT:-0}
    restart: unless-stopped
      # A ceiling, because this host has already lost PostgreSQL to a full
      # disk. Docker's default json-file driver has no limit at all: a
      # worker in a retry loop writes until the volume the database is on
      # runs out, and nothing in this stack was bounded before.
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}
    network_mode: host
    environment:
      # Not P2 or P3: this image has no vc_flatten. Those run on the segment
      # image, which carries the whole VC3D toolchain. P9 is here because the
      # plates are composed from the official ink maps, which is a download and
      # an image pipeline -- the same runtime the rest of these need.
      HELENA_WORKER_PHASES: ${HELENA_INK_PHASES:-P4,P5,P7,P9}
      # Which image this worker actually is, so a lane that declares it needs
      # another one is refused by name before it costs a lease and a render.
      # Three lanes now do: the 9 um detector, lasagna and the spiral fitter,
      # whose dependencies cannot share an environment with this one. Unset,
      # the check stays quiet rather than refusing work on an unlabelled host.
      HELENA_RUNTIME_IMAGE: ${HELENA_RUNTIME_IMAGE:-helena-worker-gpu}
      # Where the vendored upstream architecture lives on this host. Two P5
      # lanes import their model code from it -- one on sys.path, one on
      # PYTHONPATH -- and it used to arrive as a job parameter, which made the
      # import path of the model something whoever queued the job chose. Unset,
      # those two lanes refuse here instead of importing from wherever a
      # request pointed; every other lane is unaffected.
      HELENA_INK_UPSTREAM_ROOT: ${HELENA_INK_UPSTREAM_ROOT:-}
    env_file:
      - ${HELENA_INK_ENV:-/etc/helena/ink.env}
      # Credentials the panel does not yet hold. Once they are set from the
      # panel, a worker reads them from the control plane at startup and this
      # line can go.
      # Optional, and the same form the panel already uses: credentials live
      # in the control plane, and a missing file here stopped the whole stack
      # from starting on any host that keeps none.
      - path: ${HELENA_INK_AWS_ENV:-/etc/helena/aws.env}
        required: false
    # One card, named by index. `gpus: all` on a two-card box means both
    # services think they own both, and 6 GiB will not hold two models.
    gpus:
      - driver: nvidia
        # 0, like every other stack here. It defaulted to 1 because this fleet
        # has two cards and the ink lane takes the second; a host with one card
        # has only device 0, and compose failed with
        #   nvidia-container-cli: device error: 1: unknown device
        # A two-card host sets HELENA_INK_DEVICE=1, which ours does.
        device_ids: ["${HELENA_INK_DEVICE:-0}"]
        capabilities: [gpu]
    volumes:
      - ${HELENA_INK_RUNS:?set HELENA_INK_RUNS to the run directory}:${HELENA_INK_RUNS}
      # The same volume the panel writes, read-only here. It was a required
      # host path, which meant a new host could not start an ink worker until
      # somebody had put checkpoints somewhere and said where; now the panel
      # fills the volume and the worker reads it. A host path still works:
      # set HELENA_INK_MODELS.
      - ${HELENA_INK_MODELS:-helena-models}:/models:ro
      # Where vc_render_tifxyz stages the volume chunks it streams. Same path
      # inside and out, so a path in a job's recorded command means one thing.
      - ${HELENA_INK_CACHE:?set HELENA_INK_CACHE to the volume cache}:${HELENA_INK_CACHE}
      # P4 layer stacks and P5 probability maps use the panel-owned durable
      # artifact volume by default.  Without this mount, /artifacts is merely
      # the worker container's writable layer and disappears on recreation.
      - ${HELENA_INK_ARTIFACTS:-helena-artifacts}:/artifacts
      # The vendored upstream is NOT mounted here. It is needed by two P5 lanes
      # and by no other, HELENA_INK_UPSTREAM_ROOT is empty on a host that runs
      # neither, and compose has no way to leave a list entry out -- a default
      # would have meant binding some placeholder path on every host that does
      # not use it. A deployment that runs those lanes adds the mount beside
      # this one, at the same path inside and out so the variable means one
      # thing in the container and in a receipt. Without it the two lanes
      # refuse by name at startup and everything else is unaffected.
    command:
      - python3
      - /workspace/campaign-x/framework/stages/03-ink/fleet/ink_worker.py
      - --host-id
      - ${HELENA_INK_HOST_ID:?set HELENA_INK_HOST_ID to this host's name}
      # Named by slot, not by pid. The default was host-plus-pid, so a restart
      # gave the same worker a new identity: leases it still held looked like a
      # stranger's, and nothing could be attributed across the restart.
      - --worker-id
      - ${HELENA_INK_HOST_ID}-ink${HELENA_INK_SLOT:-0}
      - --runs-root
      - ${HELENA_INK_RUNS}
      - --poll-seconds
      - "${HELENA_INK_POLL_SECONDS:-10}"
      - --job-timeout
      - "${HELENA_INK_JOB_TIMEOUT:-21600}"

volumes:
  helena-models:
    name: ${HELENA_MODELS_VOLUME:-helena-models}
    external: true
  helena-artifacts:
    name: ${HELENA_ARTIFACTS_VOLUME:-helena-artifacts}
    external: true
