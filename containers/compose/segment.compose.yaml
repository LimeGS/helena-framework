# P1, and the P2/P3 job runner. One of each per host.
#
#   docker compose --env-file /etc/helena/segment.env \
#                  -f containers/compose/segment.compose.yaml up -d
#
# Named segment rather than worker, because "worker" said nothing: three of the
# four services in this fleet are workers.
#
# Host networking: the image starts a seed service on 127.0.0.1:18080 that the
# grower talks to, and the two are one unit of failure -- a worker whose seed
# service died claims tasks and fails them, burning an attempt each time. One
# per host for the same reason: two would fight over that port.
#
# No GPU. The growth profile pins use_cuda false; segmentation here is CPU work,
# and the cards belong to the model.
name: helena-segment

services:
  segment:
    image: ${HELENA_SEGMENT_IMAGE:-helena-worker-cpp:${HELENA_VERSION:-0.24.1}}
    # Not root. Every image in this fleet ran as uid 0, so a bug in a runner
    # -- a tar, a zarr reader, a model loader eating an attacker-shaped file --
    # had the whole container and every volume mounted into it. The volumes are
    # 1000:1000 on the hosts (see containers/README-nonroot.md); a host that
    # has not done that chown will see permission errors on first start rather
    # than silent damage.
    #
    # no-new-privileges as well: it costs nothing here and removes setuid as a
    # way back up.
    # 0:0 here and 1000:1000 in the ink and platform files, deliberately.
    #
    # These two run helena-worker-cpp, whose interpreter uv installed under /root
    # at mode 0700: as any other user Python cannot read its own stdlib and
    # dies with `No module named 'encodings'` before reaching main(). The
    # entrypoint also ran `mkdir -p $ARTIFACT_ROOT` on an s3:// URL, which
    # root created as a junk directory and a normal user simply cannot.
    #
    # Both are fixed in Containerfile.worker-cpp and worker-entrypoint.sh, and
    # neither takes effect until those images are rebuilt. Flipping this
    # default before that happens is how these four containers spent a few
    # minutes crash-looping. Flip it once a rebuilt image has been checked:
    #
    #   docker run --rm --user 1000:1000 --entrypoint sh helena-worker-cpp:<tag> \
    #     -c 'python3 -c "print(1)"'
    user: "${HELENA_RUN_AS:-0:0}"
    security_opt:
      - no-new-privileges:true
    container_name: helena-segment
    # unless-stopped rather than a supervisor: docker starts it at boot, and a
    # worker that dies mid-task leaves its lease to expire, which the fleet
    # already handles.
    restart: unless-stopped
      # A ceiling, because this host has already lost PostgreSQL to a full
      # disk. Docker's default json-file driver has no limit at all: a
      # worker in a retry loop writes until the volume the database is on
      # runs out, and nothing in this stack was bounded before.
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}
    network_mode: host
    env_file:
      - ${HELENA_SEGMENT_ENV:-/etc/helena/segment.env}
    volumes:
      # Where attempts and surfaces are staged, and -- when there is no object
      # storage -- where they stay.
      #
      # Object storage is optional. The default is that the panel host holds
      # everything in a volume of its own, so this is set to `helena-artifacts`
      # (the panel's, declared external below) and a published surface lands
      # exactly where every later phase looks for it. Point it at a host
      # directory instead only when ARTIFACT_ROOT is an s3:// prefix, where this
      # really is scratch.
      - ${HELENA_SEGMENT_ARTIFACTS:?set HELENA_SEGMENT_ARTIFACTS to helena-artifacts, or to a scratch directory when publishing to s3}:/artifacts
    # --allow-local-artifacts because publishing to a volume on the panel host
    # is the documented default: object storage is optional and off. Without it
    # the worker refuses a local --artifact-root, which is correct on a fleet
    # whose surfaces have to outlive any one machine and wrong on the
    # single-machine install the README describes. A fleet sets ARTIFACT_ROOT to
    # an s3:// prefix, where the flag is inert.
    command: ${HELENA_SEGMENT_ARGS:---watch --max-jobs 0 --poll-seconds 20 --allow-local-artifacts}

  # P2 and P3 as queued jobs, in this image because this is the one with the
  # whole VC3D toolchain. The ink worker claimed them and could not run them:
  # its image carries a three-tool bundle -- grow, render, mcp -- and no
  # vc_flatten, so every P3 job failed on FileNotFoundError and the queue looked
  # like flattening was broken rather than misrouted. A worker now claims only
  # the phases it can actually run.
  #
  # Same image, same env file, same runs directory as the ink worker: the job
  # queue does not care which container claims a row, only that the runtime
  # behind it is real.
  fleet-runner:
    image: ${HELENA_SEGMENT_IMAGE:-helena-worker-cpp:${HELENA_VERSION:-0.24.1}}
    # Not root. Every image in this fleet ran as uid 0, so a bug in a runner
    # -- a tar, a zarr reader, a model loader eating an attacker-shaped file --
    # had the whole container and every volume mounted into it. The volumes are
    # 1000:1000 on the hosts (see containers/README-nonroot.md); a host that
    # has not done that chown will see permission errors on first start rather
    # than silent damage.
    #
    # no-new-privileges as well: it costs nothing here and removes setuid as a
    # way back up.
    # 0:0 here and 1000:1000 in the ink and platform files, deliberately.
    #
    # These two run helena-worker-cpp, whose interpreter uv installed under /root
    # at mode 0700: as any other user Python cannot read its own stdlib and
    # dies with `No module named 'encodings'` before reaching main(). The
    # entrypoint also ran `mkdir -p $ARTIFACT_ROOT` on an s3:// URL, which
    # root created as a junk directory and a normal user simply cannot.
    #
    # Both are fixed in Containerfile.worker-cpp and worker-entrypoint.sh, and
    # neither takes effect until those images are rebuilt. Flipping this
    # default before that happens is how these four containers spent a few
    # minutes crash-looping. Flip it once a rebuilt image has been checked:
    #
    #   docker run --rm --user 1000:1000 --entrypoint sh helena-worker-cpp:<tag> \
    #     -c 'python3 -c "print(1)"'
    user: "${HELENA_RUN_AS:-0:0}"
    security_opt:
      - no-new-privileges:true
    container_name: helena-fleet-runner
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}
    network_mode: host
    env_file:
      - ${HELENA_SEGMENT_ENV:-/etc/helena/segment.env}
    environment:
      HELENA_WORKER_PHASES: ${HELENA_FLEET_RUNNER_PHASES:-P2,P3,P8}
      # Which image this worker actually is, so a lane that declares it needs
      # another one is refused by name before it costs a lease. The spiral
      # fitter's P1 lane declares helena-villa-python, which this is not.
      HELENA_RUNTIME_IMAGE: ${HELENA_RUNTIME_IMAGE:-helena-worker-cpp}
      # One connection string with two names: the segment side calls it
      # FLEET_DB, the job queue calls it CX_DB. Mapped here rather than adding a
      # second copy to the env file, where the two would drift.
      CX_DB: ${FLEET_DB:?set FLEET_DB in the segment env file}
    volumes:
      - ${HELENA_SEGMENT_ARTIFACTS:?set HELENA_SEGMENT_ARTIFACTS to helena-artifacts, or to a scratch directory when publishing to s3}:/artifacts
      # Job output: receipts and logs, at the same path the ink worker uses so a
      # path in a job row means one thing on this host.
      - ${HELENA_FLEET_RUNS:-/ssd/campaignx/runs}:${HELENA_FLEET_RUNS:-/ssd/campaignx/runs}
    entrypoint: ["python3", "/workspace/campaign-x/framework/stages/03-ink/fleet/ink_worker.py"]
    command: >-
      --host-id ${HELENA_SEGMENT_HOST_ID:?set it to this machine's name}
      --worker-id ${HELENA_SEGMENT_HOST_ID}-fleet-runner
      --runs-root ${HELENA_FLEET_RUNS:-/ssd/campaignx/runs}
      --poll-seconds 10

  # Candidate preflights, which used to run inside the panel's HTTP handler and
  # returned 503 there. The measurement asks M7 through the seed service, and the
  # panel has no service and no token -- the entrypoint mints both per container.
  # So the work runs here, behind the same entrypoint, for the same reason the
  # segmentation worker does.
  #
  # Read-only and ink-blind: it measures candidate availability and writes
  # nothing but its receipt to the control plane.
  preflight:
    image: ${HELENA_SEGMENT_IMAGE:-helena-worker-cpp:${HELENA_VERSION:-0.24.1}}
    # Not root. Every image in this fleet ran as uid 0, so a bug in a runner
    # -- a tar, a zarr reader, a model loader eating an attacker-shaped file --
    # had the whole container and every volume mounted into it. The volumes are
    # 1000:1000 on the hosts (see containers/README-nonroot.md); a host that
    # has not done that chown will see permission errors on first start rather
    # than silent damage.
    #
    # no-new-privileges as well: it costs nothing here and removes setuid as a
    # way back up.
    # 0:0 here and 1000:1000 in the ink and platform files, deliberately.
    #
    # These two run helena-worker-cpp, whose interpreter uv installed under /root
    # at mode 0700: as any other user Python cannot read its own stdlib and
    # dies with `No module named 'encodings'` before reaching main(). The
    # entrypoint also ran `mkdir -p $ARTIFACT_ROOT` on an s3:// URL, which
    # root created as a junk directory and a normal user simply cannot.
    #
    # Both are fixed in Containerfile.worker-cpp and worker-entrypoint.sh, and
    # neither takes effect until those images are rebuilt. Flipping this
    # default before that happens is how these four containers spent a few
    # minutes crash-looping. Flip it once a rebuilt image has been checked:
    #
    #   docker run --rm --user 1000:1000 --entrypoint sh helena-worker-cpp:<tag> \
    #     -c 'python3 -c "print(1)"'
    user: "${HELENA_RUN_AS:-0:0}"
    security_opt:
      - no-new-privileges:true
    container_name: helena-preflight
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}
    network_mode: host
    env_file:
      - ${HELENA_SEGMENT_ENV:-/etc/helena/segment.env}
    # preflight writes attempts where the workers do. It had no volumes at all,
    # so /artifacts was the container's own filesystem, which it cannot write:
    # `mkdir: cannot create /artifacts/attempts: Permission denied`, forever.
    volumes:
      - ${HELENA_SEGMENT_ARTIFACTS:?set HELENA_SEGMENT_ARTIFACTS to helena-artifacts, or to a scratch directory when publishing to s3}:/artifacts
    environment:
      HELENA_WORKER_KIND: preflight
      # Its own service on its own port. Every container starts one, and with
      # host networking the port is shared across the machine: two on 18080 and
      # only one holds it, which is how a previous run got 401s from workers
      # that all believed they had a service.
      MCP_PORT: ${HELENA_PREFLIGHT_MCP_PORT:-18081}
      WORKER_ID: ${HELENA_SEGMENT_HOST_ID:?set it to this machine's name}-preflight
    command: >-
      --watch
      --max-jobs 0
      --poll-seconds ${HELENA_PREFLIGHT_POLL_SECONDS:-10}
      --lease-seconds ${HELENA_PREFLIGHT_LEASE_SECONDS:-900}

volumes:
  # The panel's artifact volume, not one of this stack's own.
  #
  # external, and that is the whole point: without it compose would create
  # `helena-segment_helena-artifacts` -- a second, empty volume with a similar
  # name -- and the worker would publish into a directory the panel has never
  # heard of. Surfaces would be written, recorded, and invisible.
  #
  # It exists because the platform stack is deployed first; see
  # containers/deploy-platform.sh.
  helena-artifacts:
    external: true
    name: ${HELENA_ARTIFACTS_VOLUME:-helena-artifacts}
