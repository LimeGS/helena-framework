# P1, and the P2/P3 job runner. One of each per host.
#
#   docker compose --env-file /etc/helena/segment.env \
#                  -f containers/compose/segment.compose.yaml up -d
#
# Named segment rather than worker, because "worker" said nothing: three of the
# four services in this fleet are workers.
#
# Host networking: the image starts a seed service on 127.0.0.1:18080 that the
# grower talks to, and the two are one unit of failure -- a worker whose seed
# service died claims tasks and fails them, burning an attempt each time. One
# per host for the same reason: two would fight over that port.
#
# No GPU. The growth profile pins use_cuda false; segmentation here is CPU work,
# and the cards belong to the model.
name: helena-segment

services:
  segment:
    image: ${HELENA_SEGMENT_IMAGE:-helena-worker:${HELENA_VERSION:-0.20.0}}
    container_name: helena-segment
    # unless-stopped rather than a supervisor: docker starts it at boot, and a
    # worker that dies mid-task leaves its lease to expire, which the fleet
    # already handles.
    restart: unless-stopped
      # A ceiling, because this host has already lost PostgreSQL to a full
      # disk. Docker's default json-file driver has no limit at all: a
      # worker in a retry loop writes until the volume the database is on
      # runs out, and nothing in this stack was bounded before.
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}
    network_mode: host
    env_file:
      - ${HELENA_SEGMENT_ENV:-/etc/helena/segment.env}
    volumes:
      # Where attempts and surfaces are staged, and -- when there is no object
      # storage -- where they stay.
      #
      # Object storage is optional. The default is that the panel host holds
      # everything in a volume of its own, so this is set to `helena-artifacts`
      # (the panel's, declared external below) and a published surface lands
      # exactly where every later phase looks for it. Point it at a host
      # directory instead only when ARTIFACT_ROOT is an s3:// prefix, where this
      # really is scratch.
      - ${HELENA_SEGMENT_ARTIFACTS:?set HELENA_SEGMENT_ARTIFACTS to helena-artifacts, or to a scratch directory when publishing to s3}:/artifacts
    command: ${HELENA_SEGMENT_ARGS:---watch --max-jobs 0 --poll-seconds 20}

  # P2 and P3 as queued jobs, in this image because this is the one with the
  # whole VC3D toolchain. The ink worker claimed them and could not run them:
  # its image carries a three-tool bundle -- grow, render, mcp -- and no
  # vc_flatten, so every P3 job failed on FileNotFoundError and the queue looked
  # like flattening was broken rather than misrouted. A worker now claims only
  # the phases it can actually run.
  #
  # Same image, same env file, same runs directory as the ink worker: the job
  # queue does not care which container claims a row, only that the runtime
  # behind it is real.
  fleet-runner:
    image: ${HELENA_SEGMENT_IMAGE:-helena-worker:${HELENA_VERSION:-0.20.0}}
    container_name: helena-fleet-runner
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}
    network_mode: host
    env_file:
      - ${HELENA_SEGMENT_ENV:-/etc/helena/segment.env}
    environment:
      HELENA_WORKER_PHASES: ${HELENA_FLEET_RUNNER_PHASES:-P2,P3,P8}
      # One connection string with two names: the segment side calls it
      # FLEET_DB, the job queue calls it CX_DB. Mapped here rather than adding a
      # second copy to the env file, where the two would drift.
      CX_DB: ${FLEET_DB:?set FLEET_DB in the segment env file}
    volumes:
      - ${HELENA_SEGMENT_ARTIFACTS:?set HELENA_SEGMENT_ARTIFACTS to helena-artifacts, or to a scratch directory when publishing to s3}:/artifacts
      # Job output: receipts and logs, at the same path the ink worker uses so a
      # path in a job row means one thing on this host.
      - ${HELENA_FLEET_RUNS:-/ssd/campaignx/runs}:${HELENA_FLEET_RUNS:-/ssd/campaignx/runs}
    entrypoint: ["python3", "/workspace/campaign-x/framework/stages/03-ink/fleet/ink_worker.py"]
    command: >-
      --host-id ${HELENA_SEGMENT_HOST_ID:?set it to this machine's name}
      --worker-id ${HELENA_SEGMENT_HOST_ID}-fleet-runner
      --runs-root ${HELENA_FLEET_RUNS:-/ssd/campaignx/runs}
      --poll-seconds 10

volumes:
  # The panel's artifact volume, not one of this stack's own.
  #
  # external, and that is the whole point: without it compose would create
  # `helena-segment_helena-artifacts` -- a second, empty volume with a similar
  # name -- and the worker would publish into a directory the panel has never
  # heard of. Surfaces would be written, recorded, and invisible.
  #
  # It exists because the platform stack is deployed first; see
  # containers/deploy-platform.sh.
  helena-artifacts:
    external: true
    name: ${HELENA_ARTIFACTS_VOLUME:-helena-artifacts}
