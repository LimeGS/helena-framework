# What this machine is, reported to the control plane.
#
# The reading already existed, launched by worker-entrypoint.sh beside the
# worker. The problem was where that put it: a worker container is granted the
# cards it needs and no more -- ink takes one card by index on purpose, because
# 6 GiB will not hold two models -- so the inventory inherited a worker's slice
# and described that instead of the machine. On a host with two GTX 1660s it
# reported one, and on the host whose worker has no card at all it reported none.
#
# host_probe already tries to correct for this: it drops CUDA_VISIBLE_DEVICES and
# NVIDIA_VISIBLE_DEVICES before calling nvidia-smi, "so the probe describes the
# machine, not this process's slice of it". That defeats a filter read from the
# environment. It cannot defeat a device grant: the second card's device node is
# not inside the container to be found.
#
# So the reader gets its own container, with every card visible and nothing else
# to do. It allocates no GPU memory -- nvidia-smi only reads -- so it cannot
# contend with the models, which is the isolation the worker composes are
# protecting. This is what host_report.py's own docstring asks for: host
# inventory is a property of the machine, not of the job loop.
#
# On a host with cards, add the overlay that grants them:
#
#   HELENA_HOST_ID=gpu-1 docker compose \
#     -f containers/compose/host-report.compose.yaml \
#     -f containers/compose/host-report.gpu.compose.yaml \
#     --env-file /etc/helena/segment.env up -d
#
# Without it, on a machine with no NVIDIA driver:
#
#   HELENA_HOST_ID=swisspost-1 docker compose \
#     -f containers/compose/host-report.compose.yaml \
#     --env-file /etc/helena/host-report.env up -d
#
# Two files rather than one, because a `gpus:` reservation is not optional: on a
# host with no driver the container refuses to start, and swisspost-1 has no
# nvidia-smi at all. Cores, memory and disk are worth reporting there anyway --
# it read "not reported" for everything, which is the same as absent.
#
# Runs on every host, including ones that run no control plane. It is additive:
# the reporter inside the worker still runs and still contributes what it can
# see, and the two merge by card uuid rather than overwriting each other.
name: helena-host-report

services:
  host-report:
    # Any image carrying framework/contracts and psycopg2 will do: this reads a
    # database and shells out to nvidia-smi, and needs nothing a worker has. On
    # a host that runs no worker, point HELENA_SEGMENT_IMAGE at the panel's own
    # image -- it is already there, and pulling three gigabytes for a script
    # that polls a table is silly.
    #
    # One variable rather than a fallback chain: compose does not resolve a
    # default nested inside another default, and quietly used the innermost.
    image: ${HELENA_SEGMENT_IMAGE:-helena-worker-cpp:${HELENA_VERSION:-0.22.0}}
    container_name: helena-host-report
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}
    # Host networking, because the control plane answers on 127.0.0.1:55432 for
    # every worker on this machine and FLEET_DB is one string everywhere.
    network_mode: host
    # FLEET_DB, and HELENA_HOST_ID when the file names it.
    # Optional: a deployment that passes FLEET_DB directly needs no file, and a
    # missing env_file is otherwise a hard error.
    env_file:
      - path: ${HELENA_HOST_REPORT_ENV:-/etc/helena/segment.env}
        required: false
    # Straight to the probe. The image's own entrypoint would also start an MCP
    # server and a worker, and this machine already has both.
    # The worker image keeps its interpreter in a venv; the panel image uses the
    # system one. Naming it is cheaper than making every image agree.
    entrypoint: ["${HELENA_HOST_REPORT_PYTHON:-/opt/venv/bin/python}"]
    command:
      - /workspace/campaign-x/framework/contracts/host_report.py
      - --db
      - ${FLEET_DB:?set FLEET_DB, or put it in the env file}
      - --host-id
      - ${HELENA_HOST_ID:?set HELENA_HOST_ID to this machine's name in the panel}
      # Which filesystem "disk free" describes. Only the GPU list is merged
      # across reporters; cores, memory and disk are whatever wrote last, so two
      # reporters naming different filesystems would make that figure alternate
      # every minute with neither reading wrong.
      #
      # "/" and not the artifact root, because on this fleet ARTIFACT_ROOT is an
      # s3:// URL -- worker-entrypoint.sh passes it straight to --disk, host_probe
      # cannot stat it and falls back. Both reporters therefore describe "/"
      # today, and naming it here keeps them agreeing on purpose rather than by
      # accident. Point this at the runs volume once the worker's copy does too.
      - --disk
      - ${HELENA_HOST_REPORT_DISK:-/}
      - --every
      - "${HELENA_HOST_REPORT_SECONDS:-60}"
