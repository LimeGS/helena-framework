# One contract step, run in isolation, from images pinned by digest.
#
# This is not the fleet. The fleet is queue-driven and long-lived --
# platform/segment/ink compose files, a panel, workers that claim jobs. This
# file runs a single step against an immutable input snapshot and a new empty
# output directory, with no network, no capabilities, a read-only root and a
# read-only repository. It is the strictest thing here, which is why the
# deploys page points at it.
#
# No build contexts on purpose: images arrive by digest through
# containers/.env.example or the environment. Every run needs a new, empty
# ${HELENA_RUN_OUTPUT}.
#
# The images it named went stale when the tree was reorganised -- helena-vc3d
# stopped existing and the tools moved into helena-gpu-runtime, which carries
# both the VC3D binaries and the ink environment. One image now backs every
# step that needs either.
name: campaign-x

x-common: &common
  init: true
  read_only: true
  cap_drop: ["ALL"]
  security_opt:
    - no-new-privileges:true
  network_mode: "none"
  pids_limit: 1024
  user: "${HELENA_CONTAINER_UID:-1000}:${HELENA_CONTAINER_GID:-1000}"
  working_dir: /work/repo
  volumes:
    - type: bind
      source: ${HELENA_REPO_ROOT:?Set HELENA_REPO_ROOT to the Helena Framework repository}
      target: /work/repo
      read_only: true
    - type: bind
      source: ${HELENA_INPUT_ROOT:?Set HELENA_INPUT_ROOT to an immutable input snapshot}
      target: /inputs
      read_only: true
    - type: bind
      source: ${HELENA_MODEL_ROOT:?Set HELENA_MODEL_ROOT to a read-only model snapshot}
      target: /models
      read_only: true
    - type: bind
      source: ${HELENA_RUN_OUTPUT:?Set HELENA_RUN_OUTPUT to a new empty run directory}
      target: /outputs
      read_only: false
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=${HELENA_TMPFS_SIZE:-8g}

x-gpu: &gpu
  <<: *common
  gpus: all
  environment:
    NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
    NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}

services:
  orchestrator:
    <<: *common
    profiles: ["cpu"]
    image: ${HELENA_ORCHESTRATOR_IMAGE:?Pin HELENA_ORCHESTRATOR_IMAGE by digest}
    command: ["python3", "scripts/container/run_contract_step.py", "--help"]

  vc3d-grow:
    <<: *gpu
    profiles: ["gpu"]
    image: ${HELENA_GPU_RUNTIME_IMAGE:?Pin HELENA_GPU_RUNTIME_IMAGE by digest}
    environment:
      HELENA_IMAGE_REF: ${HELENA_GPU_RUNTIME_IMAGE:?Pin HELENA_GPU_RUNTIME_IMAGE by digest}
    command: ["python3", "scripts/container/run_contract_step.py", "--step", "vc3d-grow", "--manifest", "/inputs/stage-manifest.json", "--output", "/outputs", "--dry-run"]

  # There was a `scrollfiesta` service here calling `--step scrollfiesta-mesh`.
  # run_contract_step.py has four steps -- vc3d-grow, ink-inference, qc,
  # high-recall -- and that is not one of them, so argparse refused it before
  # anything ran. It is removed rather than repaired because nothing here knows
  # what the step was meant to do.

  ink:
    <<: *gpu
    profiles: ["gpu"]
    image: ${HELENA_GPU_RUNTIME_IMAGE:?Pin HELENA_GPU_RUNTIME_IMAGE by digest}
    environment:
      HELENA_IMAGE_REF: ${HELENA_GPU_RUNTIME_IMAGE:?Pin HELENA_GPU_RUNTIME_IMAGE by digest}
    command: ["python3", "scripts/container/run_contract_step.py", "--step", "ink-inference", "--manifest", "/inputs/stage-manifest.json", "--output", "/outputs", "--dry-run"]

  qc:
    <<: *common
    profiles: ["cpu"]
    image: ${HELENA_GPU_RUNTIME_IMAGE:?Pin HELENA_GPU_RUNTIME_IMAGE by digest}
    environment:
      HELENA_IMAGE_REF: ${HELENA_GPU_RUNTIME_IMAGE:?Pin HELENA_GPU_RUNTIME_IMAGE by digest}
    command: ["python3", "scripts/container/run_contract_step.py", "--step", "qc", "--manifest", "/inputs/stage-manifest.json", "--output", "/outputs", "--dry-run"]

  high-recall:
    <<: *common
    profiles: ["cpu"]
    image: ${HELENA_GPU_RUNTIME_IMAGE:?Pin HELENA_GPU_RUNTIME_IMAGE by digest}
    environment:
      HELENA_IMAGE_REF: ${HELENA_GPU_RUNTIME_IMAGE:?Pin HELENA_GPU_RUNTIME_IMAGE by digest}
    command: ["python3", "scripts/container/run_contract_step.py", "--step", "high-recall", "--manifest", "/inputs/stage-manifest.json", "--output", "/outputs", "--dry-run"]

  viewer:
    <<: *common
    profiles: ["viewer"]
    image: ${HELENA_GPU_RUNTIME_IMAGE:?Pin HELENA_GPU_RUNTIME_IMAGE by digest}
    network_mode: "bridge"
    ports:
      - "${HELENA_VIEWER_BIND:-127.0.0.1}:${HELENA_VIEWER_PORT:-8780}:8780"
    command: ["python3", "-m", "http.server", "8780", "--directory", "/outputs"]
